<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}EVHub – Smart EV Charging{% endblock %}</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #0f2027, #020617);
            color: #e5e7eb;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 90px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(14px);
            position: fixed;
            top: 0;
            bottom: 0;
            padding-top: 20px;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar a {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            color: #9ca3af;
            font-size: 1.3rem;
            transition: all 0.3s ease;
        }

        .sidebar a:hover {
            color: #38bdf8;
            background: rgba(56,189,248,0.1);
        }

        /* Main Area */
        .main {
            margin-left: 90px;
        }

        /* Top Navbar */
        .topbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(2,6,23,0.7);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand {
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 1.2rem;
        }

        .content {
            padding: 40px;
        }

        /* Cards */
        .glass-card {
            background: rgba(15,23,42,0.7);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        .section-title {
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <a href="{% url 'dashboard' %}" title="Dashboard"><i class="bi bi-speedometer2"></i></a>
    <a href="{% url 'slots' %}" title="Slots"><i class="bi bi-calendar2-event"></i></a>
    <a href="{% url 'history' %}" title="History"><i class="bi bi-clock-history"></i></a>
    <a href="{% url 'poi_recommendations' %}" title="Map"><i class="bi bi-geo-alt"></i></a>
    <a href="{% url 'logout' %}" title="Logout"><i class="bi bi-box-arrow-right"></i></a>
</div>

<!-- Main -->
<div class="main">

    <!-- Topbar -->
    <div class="topbar">
        <div class="brand">EVHUB</div>
        <div class="text-muted small">Smart EV Charging Platform</div>
    </div>

    <!-- Page Content -->
    <div class="content">
        {% block content %}
        <!-- Example Cards -->
        <div class="row g-4">
            <div class="col-md-4">
                <div class="glass-card">
                    <h6 class="section-title">⚡ Active Stations</h6>
                    <h2>24</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="glass-card">
                    <h6 class="section-title">🔋 Available Slots</h6>
                    <h2>12</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="glass-card">
                    <h6 class="section-title">📈 Energy Delivered</h6>
                    <h2>1.8 MWh</h2>
                </div>
            </div>
        </div>
        {% endblock %}
    </div>

</div>

</body>
</html>
