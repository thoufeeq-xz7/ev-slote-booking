<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}EVHub Owner{% endblock %}</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f7fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: row;
        }
        .sidebar {
            width: 250px;
            background: #212529;
            color: #fff;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        .sidebar .brand {
            font-size: 1.7rem;
            font-weight: bold;
            padding: 1.5rem 1rem 1rem 1.5rem;
            letter-spacing: 1px;
            color: #0d6efd;
            background: #181c20;
            border-bottom: 1px solid #343a40;
        }
        .sidebar .nav-link {
            color: #adb5bd;
            padding: 0.9rem 1.5rem;
            font-size: 1.08rem;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover {
            background: #0d6efd;
            color: #fff;
        }
        .sidebar .sidebar-footer {
            margin-top: auto;
            padding: 1rem 1.5rem;
            font-size: 0.95rem;
            color: #adb5bd;
            border-top: 1px solid #343a40;
            background: #181c20;
        }
        .main-content {
            margin-left: 250px;
            padding: 2.5rem 2rem 2rem 2rem;
            width: 100%;
            min-height: 100vh;
        }
        @media (max-width: 991px) {
            .sidebar {
                width: 100px;
            }
            .main-content {
                margin-left: 100px;
                padding: 1.5rem 0.5rem;
            }
            .sidebar .brand, .sidebar .sidebar-footer {
                font-size: 1rem;
                padding-left: 0.7rem;
            }
            .sidebar .nav-link {
                font-size: 0.95rem;
                padding-left: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <nav class="sidebar d-flex flex-column">
        <div class="brand">
            <i class="bi bi-lightning-charge-fill me-2"></i>EVHub
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'owner_dashboard' %}active{% endif %}" href="{% url 'owner_dashboard' %}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'owner_add_station' %}active{% endif %}" href="{% url 'owner_add_station' %}"><i class="bi bi-plus-circle me-2"></i>Add Station</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'owner_profile' %}active{% endif %}" href="{% url 'owner_profile' %}"><i class="bi bi-person-circle me-2"></i>Profile</a>
            </li>
        </ul>
        <div class="sidebar-footer mt-auto">
            <div><i class="bi bi-person-badge me-2"></i>{{ owner.company_name|default:'Owner' }}</div>
            <div class="small">Status: {% if owner.is_verified %}<span class="text-success">Verified</span>{% else %}<span class="text-warning">Pending</span>{% endif %}</div>
            <div class="mt-3">
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger w-100">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
            </div>
        </div>
    </nav>
    <main class="main-content">
        <div class="container-fluid">
            {% block content %}{% endblock %}
        </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
